default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: prairie_peak_development

test:
  <<: *default
  database: prairie_peak_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: prairie_peak_production
